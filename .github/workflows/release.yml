name: Release

# =============================================================================
# Kora Protocol — Reproducible-Build Release Workflow
#
# Triggered on: git tag push matching vX.Y.Z
#
# This workflow:
#   1. Builds all WASM binaries in a clean, pinned-toolchain environment
#   2. Records SHA-256 hashes for every contract
#   3. Runs a second independent rebuild and verifies hashes are byte-identical
#   4. Publishes a pass/fail verification report in the job summary
#   5. Creates a GitHub release and attaches the hash manifest as an artifact
#
# Non-determinism eliminated by:
#   - rust-toolchain.toml pins exact compiler version (1.75.0)
#   - CARGO_ENCODED_RUSTFLAGS / RUSTFLAGS stripped of absolute paths
#   - SOURCE_DATE_EPOCH=0 prevents timestamps leaking into debug sections
#   - lto=true + codegen-units=1 in [profile.release] (Cargo.toml)
#   - opt-level="z", strip="symbols", debug=0 (Cargo.toml)
#   - All builds run in the same ubuntu-latest runner image
#   - No incremental compilation (CARGO_INCREMENTAL=0)
#
# Any hash mismatch causes the workflow to fail loudly (non-zero exit).
# =============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a GitHub release

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Eliminate all non-determinism sources
  SOURCE_DATE_EPOCH: "0"
  CARGO_INCREMENTAL: "0"
  # Prevent Cargo from embedding absolute paths into DWARF debug info
  RUSTFLAGS: "--remap-path-prefix $HOME/.cargo/registry=CARGO_REGISTRY"

jobs:
  # ── Build #1 (canonical) ──────────────────────────────────────────────────
  build-canonical:
    name: Build canonical WASMs
    runs-on: ubuntu-latest
    outputs:
      # Pass hash file path to the verify job
      hashes: ${{ steps.record.outputs.hashes }}

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must be in format vX.Y.Z, got: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml in the repo root pins the exact channel/version.
        # dtolnay/rust-toolchain reads that file automatically.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-repro-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-repro-

      - name: Install stellar CLI (pinned)
        run: cargo install stellar-cli --locked --version 21.4.1

      - name: Clean workspace before canonical build
        run: cargo clean

      - name: Build #1 — canonical optimized WASMs
        run: make build-optimized

      - name: Record canonical hashes
        id: record
        run: |
          mkdir -p releases
          HASHES_FILE="releases/${{ env.VERSION }}.hashes"

          echo "=== Kora Protocol — Canonical WASM SHA-256 Hashes ===" | tee "$HASHES_FILE.header"
          echo "Version : ${{ env.VERSION }}" | tee -a "$HASHES_FILE.header"
          echo "Commit  : ${{ github.sha }}" | tee -a "$HASHES_FILE.header"
          echo "Built   : $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$HASHES_FILE.header"
          echo "Toolchain: $(rustc --version)" | tee -a "$HASHES_FILE.header"
          echo "" | tee -a "$HASHES_FILE.header"

          > "$HASHES_FILE"
          for contract in access_control invoice_nft marketplace financing_pool treasury risk_registry price_oracle; do
            wasm="target/wasm32-unknown-unknown/release/kora_${contract}.wasm"
            if [ -f "$wasm" ]; then
              sha256sum "$wasm" >> "$HASHES_FILE"
              echo "  ✓ ${contract}: $(sha256sum "$wasm" | awk '{print $1}')"
            else
              echo "  ⚠ ${contract}: WASM not found (skipping)"
            fi
          done

          echo "hashes=$HASHES_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload canonical WASMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-wasms-${{ github.run_number }}
          path: |
            target/wasm32-unknown-unknown/release/kora_*.wasm
            releases/${{ env.VERSION }}.hashes
          retention-days: 90

  # ── Build #2 (independent rebuild for reproducibility verification) ────────
  verify-reproducible:
    name: Verify reproducible build
    runs-on: ubuntu-latest
    needs: build-canonical

    steps:
      - name: Checkout at tag (same ref as build #1)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract version
        run: |
          echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain (identical to build #1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-repro-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-repro-

      - name: Install stellar CLI (pinned, same version as build #1)
        run: cargo install stellar-cli --locked --version 21.4.1

      - name: Download canonical WASMs from build #1
        uses: actions/download-artifact@v4
        with:
          name: canonical-wasms-${{ github.run_number }}
          path: canonical

      - name: Clean and rebuild #2 — independent reproducibility check
        run: |
          cargo clean
          make build-optimized

      - name: Compare hashes — fail loudly on any mismatch
        id: compare
        run: |
          CANONICAL_HASHES="canonical/releases/${{ env.VERSION }}.hashes"
          CONTRACTS=(access_control invoice_nft marketplace financing_pool treasury risk_registry price_oracle tranche dispute_resolution dispute_escrow governance governance_voting parameter_registry)
          PASS=true
          REPORT=""

          echo "=== Reproducibility Verification Report ===" | tee /tmp/verify-report.txt
          echo "Version : ${{ env.VERSION }}"                | tee -a /tmp/verify-report.txt
          echo "Commit  : ${{ github.sha }}"                 | tee -a /tmp/verify-report.txt
          echo "Run     : #${{ github.run_number }}"         | tee -a /tmp/verify-report.txt
          echo ""                                             | tee -a /tmp/verify-report.txt
          echo "Contract                 Build#1 SHA-256                                                          Build#2 SHA-256                                                          Status" | tee -a /tmp/verify-report.txt
          echo "--------------------     ----------------------------------------------------------------         ----------------------------------------------------------------         ------" | tee -a /tmp/verify-report.txt

          for contract in "${CONTRACTS[@]}"; do
            wasm="target/wasm32-unknown-unknown/release/kora_${contract}.wasm"
            canonical_wasm="canonical/target/wasm32-unknown-unknown/release/kora_${contract}.wasm"

            if [ ! -f "$wasm" ]; then
              echo "SKIP ${contract}: rebuild WASM not found" | tee -a /tmp/verify-report.txt
              continue
            fi

            HASH2=$(sha256sum "$wasm" | awk '{print $1}')
            HASH1=$(grep "kora_${contract}.wasm" "$CANONICAL_HASHES" | awk '{print $1}' || echo "NOT_FOUND")

            if [ "$HASH1" = "NOT_FOUND" ]; then
              printf "%-24s %-72s %-72s %s\n" "$contract" "NOT_IN_CANONICAL" "$HASH2" "SKIP" | tee -a /tmp/verify-report.txt
              continue
            fi

            if [ "$HASH1" = "$HASH2" ]; then
              STATUS="✓ PASS"
            else
              STATUS="✗ FAIL"
              PASS=false
            fi

            printf "%-24s %-72s %-72s %s\n" "$contract" "$HASH1" "$HASH2" "$STATUS" | tee -a /tmp/verify-report.txt
          done

          echo ""                                                               | tee -a /tmp/verify-report.txt
          if [ "$PASS" = "true" ]; then
            echo "✓ RESULT: ALL CONTRACTS REPRODUCED BYTE-IDENTICALLY"        | tee -a /tmp/verify-report.txt
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "✗ RESULT: HASH MISMATCH — REPRODUCIBLE BUILD FAILED"        | tee -a /tmp/verify-report.txt
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi

          cat /tmp/verify-report.txt

          if [ "$PASS" != "true" ]; then
            echo ""
            echo "ERROR: One or more WASM binaries are not reproducible."
            echo "This means the deployed bytecode cannot be independently verified from source."
            echo "Investigate: different Rust versions, non-deterministic codegen, absolute paths in RUSTFLAGS."
            exit 1
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-report-${{ github.run_number }}
          path: /tmp/verify-report.txt
          retention-days: 365

      - name: Write verification result to job summary
        if: always()
        run: |
          echo "## Kora Protocol — Reproducible Build Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Toolchain | \`1.75.0\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | **${{ steps.compare.outputs.result }}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Verification Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/verify-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-canonical, verify-reproducible]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Download canonical WASMs and hashes
        uses: actions/download-artifact@v4
        with:
          name: canonical-wasms-${{ github.run_number }}
          path: canonical

      - name: Download verification report
        uses: actions/download-artifact@v4
        with:
          name: reproducibility-report-${{ github.run_number }}
          path: /tmp

      - name: Assemble release manifest (hashes + verification result)
        run: |
          HASHES_FILE="canonical/releases/${{ env.VERSION }}.hashes"
          MANIFEST="releases/${{ env.VERSION }}-verified-manifest.txt"
          mkdir -p releases

          {
            echo "# Kora Protocol ${{ env.VERSION }} — Verified WASM Manifest"
            echo ""
            echo "Commit  : ${{ github.sha }}"
            echo "Toolchain: 1.75.0 (rust-toolchain.toml)"
            echo "Verified: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Reproducibility Result"
            echo ""
            cat /tmp/verify-report.txt
            echo ""
            echo "## SHA-256 Hashes"
            echo ""
            echo "Verify your local build matches:"
            echo "  sha256sum -c ${{ env.VERSION }}.hashes"
            echo ""
            cat "$HASHES_FILE"
          } > "$MANIFEST"

          # Also copy the plain hash file for sha256sum -c compatibility
          cp "$HASHES_FILE" "releases/${{ env.VERSION }}.hashes"

      - name: Extract changelog excerpt
        run: |
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[${{ env.VERSION }}\]/,/^## \[/" CHANGELOG.md \
            | head -n -1 \
            | tail -n +1 \
            > /tmp/changelog-excerpt.md || echo "No changelog entry found for ${{ env.VERSION }}" > /tmp/changelog-excerpt.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.VERSION }}" \
            --title "Kora Protocol ${{ env.VERSION }}" \
            --notes-file /tmp/changelog-excerpt.md \
            "releases/${{ env.VERSION }}.hashes#WASM SHA-256 Hashes" \
            "releases/${{ env.VERSION }}-verified-manifest.txt#Verified Deployment Manifest"

      - name: Write release summary
        run: |
          echo "## Kora Protocol ${{ env.VERSION }} Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Description |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.VERSION }}.hashes\` | SHA-256 hashes for \`sha256sum -c\` verification |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.VERSION }}-verified-manifest.txt\` | Full reproducibility verification report + hashes |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Independent Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Any contributor can independently verify the deployed WASM matches reviewed source:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "git checkout ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "make clean && make build-optimized" >> "$GITHUB_STEP_SUMMARY"
          echo "curl -sL https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.VERSION }}.hashes -o expected.hashes" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256sum -c expected.hashes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
